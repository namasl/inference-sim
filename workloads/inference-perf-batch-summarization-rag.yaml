# BLIS workload — mirror of inference-perf workload-catalog/batch-summarization-rag
# Source: github.com/kubernetes-sigs/inference-perf/blob/main/workload-catalog/batch-summarization-rag/config.json
# Target model: meta-llama/llama-3.3-70b-instruct (128K context)
#
# WHY THIS WORKLOAD
#   The catalog tags this as suitable_optimizations: ["Prefix aware routing",
#   "KV cache offloading"], prefill_decode_ratio: 30.0 (strongly prefill-bound).
#   Two distinct request populations share a small fixed system prompt: short
#   vector-search QA (~2k tokens) and full-document reads (~60k tokens).
#   The cache-hit pattern on the shared 500-token system prompt makes prefix-aware
#   routing effective; the long-tail doc reads stress KV capacity.
#
# Catalog → BLIS mapping
#   system_prompt (fixed 500 tok)              → prefix_length: 500
#       Small shared prompt common across all requests. Direct copy.
#
#   input_sequence_length (bimodal, mean=15000, std=22000, [1000, 80000])
#                                              → TWO CLIENTS (bimodal decomposition)
#       BLIS has no native bimodal distribution. The catalog README describes
#       "a massive split between short vector QA (~2k tokens) and full document
#       reads (~60k tokens)." We decompose into two clients whose combined
#       arrival reproduces the catalog mean:
#         w * 2000 + (1-w) * 60000 = 15000  →  w = 0.776
#       Client vector-qa (rate_fraction=0.78): lognormal, mean≈2000
#       Client doc-read  (rate_fraction=0.22): lognormal, mean≈60000
#       Combined check: 0.78×2000 + 0.22×60000 = 14760 ≈ 15000 ✓
#       Note: mode locations (2000, 60000) and per-mode std_devs are derived
#       from the README examples; the catalog gives only aggregate stats.
#       Both clients share prefix_group (same 500-tok system prompt → shared
#       KV cache for prefix).
#       DEVIATION: inference-perf.yaml approximates bimodal with a single
#       normal(mean=15000, std=22000); our two-client decomposition is more
#       faithful to the README intent. BLIS does not support bimodal natively.
#
#   output_sequence_length (normal mean=500, std=300, [50, 2000])
#                                              → output_distribution (gaussian)
#       Direct copy of catalog parameters. Same for both clients.
#
#   number_of_turns: 1, multi_turn: false      → no multi_turn block
#   time_between_turns: 0                      → N/A
#
# Lognormal (μ, σ) computed from per-mode (mean, std):
#   vector-qa (mean=2000, std=800):
#     sigma² = ln(1 + (800/2000)²)  = ln(1.16)   = 0.1484 → sigma ≈ 0.3853
#     mu     = ln(2000) − 0.0742                           ≈ 7.527
#   doc-read (mean=60000, std=20000):
#     sigma² = ln(1 + (20000/60000)²) = ln(1.111) = 0.1054 → sigma ≈ 0.3246
#     mu     = ln(60000) − 0.0527                          ≈ 10.949
#
# Context budget (128K):
#   vector-qa worst: prefix(500) + input(max=8000) + output(max=2000) =  10500 ✓
#   doc-read  worst: prefix(500) + input(max=80000) + output(max=2000) = 82500 ✓
#
# Remaining gaps vs catalog (cannot fix without BLIS schema changes):
#   - Native bimodal distribution not supported; two-client decomposition
#     approximates the split but does not reproduce exact bimodal shape.
#   - Per-mode std_devs estimated from README examples (catalog has only
#     aggregate mean=15000, std=22000).
#   - Open-loop Poisson arrival vs catalog's closed-loop concurrency stages.
#   - input_sequence_type_token_ratio: 0.2 is metadata BLIS doesn't model.
#
# Run:
#   ./blis run --model meta-llama/llama-3.3-70b-instruct \
#     --workload-spec workloads/inference-perf-batch-summarization-rag.yaml \
#     --num-instances 4 --routing-policy weighted

version: "2"
seed: 42
category: language
aggregate_rate: 3.0
num_requests: 1000

# Goodput SLOs from config.json metadata.slos (target percentile noted per field).
goodput_slo_targets:
  batch:
    ttft_ms: 15000    # ttft_p90_ms
    itl_ms: 150       # itl_p95_ms
    e2e_ms: 630000    # e2e_p99_ms

clients:
  - id: "vector-qa"
    tenant_id: "rag-users"
    slo_class: "batch"
    rate_fraction: 0.78
    streaming: false
    arrival:
      process: poisson
    input_distribution:
      type: lognormal
      params:
        mu: 7.527
        sigma: 0.3853
        min: 1000
        max: 8000
    output_distribution:
      type: gaussian
      params:
        mean: 500
        std_dev: 300
        min: 50
        max: 2000
    prefix_group: "rag-system-prompt"
    prefix_length: 500

  - id: "doc-read"
    tenant_id: "rag-users"
    slo_class: "batch"
    rate_fraction: 0.22
    streaming: false
    arrival:
      process: poisson
    input_distribution:
      type: lognormal
      params:
        mu: 10.949
        sigma: 0.3246
        min: 8000
        max: 80000
    output_distribution:
      type: gaussian
      params:
        mean: 500
        std_dev: 300
        min: 50
        max: 2000
    prefix_group: "rag-system-prompt"
    prefix_length: 500
