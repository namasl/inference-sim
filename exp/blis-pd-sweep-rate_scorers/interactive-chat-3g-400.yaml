        min: 10
        max: 1000
    prefix_group: "interactive-chat-system-prompt-2"
    prefix_length: 5000
    reasoning:
      reason_ratio_distribution:
        type: gaussian
        params:
          mean: 0
          std_dev: 0
          min: 0
          max: 0
      multi_turn:
        max_rounds: 4
        think_time_us: 45000000
        context_growth: accumulate

  - id: "interactive-chat-g3"
    tenant_id: "chat-users-g3"
    slo_class: "standard"
    rate_fraction: 0.33
    streaming: true
    arrival:
      process: poisson
