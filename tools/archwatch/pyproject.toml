[project]
name = "archwatch"
version = "0.1.0"
description = "Early-warning pipeline for zero-day model architecture support in BLIS (prototype)"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.26",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
archwatch = "archwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
