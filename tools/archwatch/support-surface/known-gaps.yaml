# archwatch — BLIS's known approximations, where they bite, and how wrong they are.
#
# Sourced from the "Known approximations for MLA / FP8 / DSA models" box in
# docs/reference/models.md:36-45, plus code seams verified in the parent worktree.
# Gaps NOT in that box are marked `documented_in: code-only` and carry the evidence
# for why they are gaps (usually: nothing in sim/ or cmd/ reads the field at all).
#
# Fields:
#   id           stable key; the stage-2 skill cites this when it assigns Bucket 2.
#   mechanism    the model-architecture mechanism, in architecture language.
#   keywords     lowercase substrings matched against a config's KEYS and its string
#                VALUES by Surface.match_gaps(). A cheap pre-hint for stage 2 — NOT a
#                classification. Deliberately specific: a keyword that matches every
#                MoE config is worse than no keyword.
#   impact       which BLIS number is wrong, in which direction, by how much where known.
#   direction    pessimistic | optimistic | unknown  (BLIS vs reality)
#   scope        what is already correct, so stage 2 does not re-litigate it.
#   seam_refs    the functions that would need a new branch.
#   documented_in  docs ref, or "code-only".

gaps:

  - id: mla_step_time_kv_read
    mechanism: "Multi-head Latent Attention (MLA) compressed-KV cache"
    keywords: [kv_lora_rank, qk_rope_head_dim, qk_nope_head_dim, v_head_dim,
               latent attention, mla]
    impact: "Step time sizes the KV read/write as the standard 2 x num_kv_heads x
      head_dim per token per layer instead of the MLA latent kv_lora_rank +
      qk_rope_head_dim. GLM-5.2: 12288 vs 576, ~21x over-counted. Decode is
      KV-read-bound, so decode step time and TTFT are over-estimated."
    direction: pessimistic
    scope: "Step time only. KV block capacity and PD KV-transfer sizing are already
      MLA-aware (sim/latency/kv_capacity.go:135-152). blis run warns when an MLA model
      is detected (cmd/root.go:924)."
    seam_refs: ["sim/latency/trained_physics_model.go:671",
                "sim/latency/trained_physics_model.go:623",
                "sim/latency/trained_physics_model.go:1150",
                "sim/latency/kv_capacity.go:135-152"]
    documented_in: "docs/reference/models.md:37"

  - id: mla_attention_projection_weights
    mechanism: "MLA down/up projection matrices (q_lora_rank / kv_lora_rank)"
    keywords: [q_lora_rank, kv_lora_rank, qk_head_dim, qk_nope_head_dim, v_head_dim]
    impact: "Attention weight bytes are charged with the standard dense
      hidden x (2 x hidden + 2 x kv_dim) formula, which does not describe MLA's
      low-rank down/up factorization. Magnitude depends on q_lora_rank vs hidden_size."
    direction: unknown
    scope: "Only the KV FOOTPRINT uses the compressed-latent shape; the attention
      WEIGHT term does not."
    seam_refs: ["sim/latency/kv_capacity.go:624",
                "sim/latency/trained_physics_model.go:693"]
    documented_in: "docs/reference/models.md:41"

  - id: hybrid_linear_attn_weights
    mechanism: "Hybrid attention: linear-attention (KDA / delta-rule) layers"
    keywords: [linear_attn_config, full_attn_layers, kda_layers, kimi delta attention,
               linear attention, delta rule, short_conv]
    impact: "The linear-attention layers are charged FULL-attention weight bytes
      (Q/K/V/O projections over all num_hidden_layers), though their real parameter
      shape differs. Weight over-count scales with the linear-attention layer share —
      Kimi-K3: 69 of 93 layers."
    direction: pessimistic
    scope: "KV capacity IS layer-type-aware (#1635, sizes over
      len(linear_attn_config.full_attn_layers)) and so IS step time (#1636: full layers
      keep the O(N^2)/O(context) attention terms, KDA layers are charged an O(N) prefill
      / O(state) decode cost). WEIGHTS are the one remaining gap (#1638). blis run warns
      when a hybrid model is detected (cmd/root.go:938-944)."
    seam_refs: ["sim/latency/kv_capacity.go:700",
                "sim/model_hardware_config.go:74-76"]
    documented_in: "docs/reference/models.md:45"
    notes: "Secondary, opposite-signed effect: the KDA step-time substitution charges
      ~d_head per token, which EXCEEDS the full-attention cost whenever the sequence is
      shorter than ~d_head (K3: 85-128 tokens). So 'hybrid <= all-full' does not hold at
      short context (sim/latency/trained_physics_model.go:563-567, :641-645)."

  - id: mamba_ssm_state_unmodeled
    mechanism: "State-space / recurrent layers declared by any convention other than
      linear_attn_config.full_attn_layers"
    keywords: [mamba, ssm, state_size, mamba_d_state, mamba_d_conv, mamba_expand,
               conv_kernel, d_inner, time_step_rank, rwkv, layer_types,
               attn_layer_indices, full_attention_idx, hybrid_override_pattern]
    impact: "The only hybrid convention BLIS recognizes is
      len(linear_attn_config.full_attn_layers) (sim/latency/config.go:152-168). A
      Mamba/Jamba/RWKV-style config — or a hybrid using HF's layer_types list — resolves
      to 0, so EffectiveKVBearingLayers falls back to ALL layers and every recurrent
      layer is charged a growing per-token KV cache it does not have. For a 1:7
      attention:SSM ratio that is an ~8x KV over-count, which understates KV block
      capacity and therefore batch size."
    direction: pessimistic
    scope: "No part of BLIS models a fixed-size recurrent state as such; the
      linear_attn_config path only removes layers from the KV count."
    seam_refs: ["sim/latency/config.go:152-168",
                "sim/model_hardware_config.go:78-90",
                "sim/latency/kv_capacity.go:181"]
    documented_in: "code-only"
    notes: "Evidence: grep for mamba / ssm / state_size / conv_kernel / layer_types over
      sim/ and cmd/ finds no reader."

  - id: sliding_window_unmodeled
    mechanism: "Sliding-window / local attention (bounded per-layer KV)"
    keywords: [sliding_window, sliding_attention, window_size, local_attention,
               attention_chunk_size, use_local_attention, sliding_window_pattern,
               interleaved_sliding_window]
    impact: "KV bytes per token are charged over every KV-bearing layer at full
      sequence length. A sliding-window layer caps its KV at the window, so for a
      model whose layers are mostly SWA (Gemma-2/3 5:1, Ministral, gpt-oss alternating,
      Qwen with use_sliding_window) the KV footprint at long context is over-counted by
      roughly context/window on those layers."
    direction: pessimistic
    scope: "Nothing in BLIS reads any window field. max_position_embeddings feeds
      --max-model-len only; it does not bound per-layer KV."
    seam_refs: ["sim/latency/kv_capacity.go:181",
                "sim/model_hardware_config.go:78-90"]
    documented_in: "code-only"
    notes: "Evidence: grep for sliding_window over sim/ and cmd/ finds no reader. Only
      reported when the field is non-null — use_sliding_window: false /
      sliding_window: null configs are inert and are in ignored_fields."

  - id: first_k_dense_replace_capacity_only
    mechanism: "Dense-layer prefix in a MoE model (first_k_dense_replace)"
    keywords: [first_k_dense_replace]
    impact: "The step-time model's MoE/dense layer split reads only
      interleave_moe_layer_step, so all num_hidden_layers are treated as MoE for a
      dense-prefix model. Over-counts MoE FFN compute and routed-expert weight loading
      by K/num_hidden_layers (GLM-5.2: 3/78 ~ 4%; DeepSeek-V2-Lite: 1/27 ~ 4%)."
    direction: pessimistic
    scope: "Weight accounting on the CAPACITY path already applies the split
      (sim/latency/kv_capacity.go:677-689)."
    seam_refs: ["sim/latency/trained_physics_model.go:1083-1090",
                "sim/latency/kv_capacity.go:677-689"]
    documented_in: "docs/reference/models.md:38"

  - id: moe_layer_pattern_lists_unparsed
    mechanism: "Per-layer MoE/dense placement expressed as a list or a stride other
      than interleave_moe_layer_step"
    keywords: [mlp_only_layers, decoder_sparse_step, moe_layer_freq, layer_types,
               moe_layer_interval, dense_layer_indices, num_dense_layers]
    impact: "BLIS understands exactly two layer patterns: the every-Nth scalar
      interleave_moe_layer_step and the prefix first_k_dense_replace. A config that
      places dense MLP layers via a list (Qwen3-MoE mlp_only_layers), a stride field of
      another name (decoder_sparse_step), or a per-layer moe_layer_freq LIST is read as
      all-MoE, over-counting expert FLOPs and weight bytes on the dense layers."
    direction: pessimistic
    scope: "moe_layer_freq as a SCALAR is harmless (it is 1 in every committed config,
      meaning every layer) — but it is still unread, so a value != 1 would be missed."
    seam_refs: ["sim/latency/config.go:388",
                "sim/latency/config.go:410",
                "sim/latency/trained_physics_model.go:1083-1090",
                "sim/latency/kv_capacity.go:650-693"]
    documented_in: "code-only"

  - id: novel_moe_routing_unparsed
    mechanism: "Grouped / hierarchical / re-scaled expert routing"
    keywords: [n_group, topk_group, topk_method, scoring_func, routed_scaling_factor,
               noaux_tc, norm_topk_prob, group_limited_greedy, e_score_correction_bias,
               n_shared_experts_gate]
    impact: "The step-time and weight models reduce all routing to
      kEff = max(1, num_experts_per_tok) (sim/latency/trained_physics_model.go:1153).
      Node-limited / group-limited routing (n_group + topk_group) changes which experts
      a token can reach and therefore the real per-GPU expert load and the
      dispatch/combine traffic pattern — BLIS assumes balanced placement over the whole
      expert set (sim.BalancedPlacement, sim/latency/trained_physics_model.go:1165)."
    direction: unknown
    scope: "Expert COUNT and activation count are parsed correctly; it is the routing
      TOPOLOGY that is invisible."
    seam_refs: ["sim/latency/config.go:92-107",
                "sim/latency/trained_physics_model.go:1153",
                "sim/latency/trained_physics_model.go:604",
                "sim/latency/trained_physics_model.go:1165"]
    documented_in: "code-only"

  - id: blockwise_fp8_flattened
    mechanism: "Block-wise / group-wise FP8 and mixed-precision checkpoints"
    keywords: [weight_block_size, modules_to_not_convert, ignored_layers,
               activation_scheme, fp8, float8, mxfp4, nvfp4, block_quant]
    impact: "quantization_config with quant_method fp8 becomes a flat 1.0 byte/param
      (sim/latency/config.go:265-267). The per-block scale tensors are not added, and
      the modules_to_not_convert set (layernorms, gates, the DSA indexer, lm_head,
      embeddings, MTP modules kept at bf16) is not excluded, so those modules are
      charged 1 byte/param instead of 2. Net: a slightly LOW weight estimate."
    direction: optimistic
    scope: "Uniform-precision GPTQ/AWQ/compressed-tensors bits are read correctly
      (sim/latency/config.go:250-291); FP4/MXFP4 method names resolve to 0 unless a
      bits field is present, which then falls back to torch_dtype."
    seam_refs: ["sim/latency/config.go:245-294",
                "sim/latency/kv_capacity.go:719-722",
                "sim/model_hardware_config.go:99-104"]
    documented_in: "docs/reference/models.md:39"

  - id: dsa_indexer_unmodeled
    mechanism: "DeepSeek sparse attention (DSA) indexer"
    keywords: [index_n_heads, index_topk, index_head_dim, indexer, sparse attention,
               dsa, lightning_indexer]
    impact: "The indexer's own weights and its index KV cache are charged nothing, and
      the sparse-attention read pattern (top-k of the context rather than all of it) is
      not modeled — attention is still priced as dense over the full context. A
      second-order OPTIMISTIC gap on weights, a PESSIMISTIC one on the attention term."
    direction: unknown
    scope: "The MLA latent capacity for the same models IS correct."
    seam_refs: ["sim/latency/trained_physics_model.go:638",
                "sim/latency/kv_capacity.go:624"]
    documented_in: "docs/reference/models.md:40"

  - id: mtp_module_weights_unmodeled
    mechanism: "Multi-token-prediction (MTP) / next-N-prediction module"
    keywords: [num_nextn_predict_layers, mtp, next_n_predict, num_mtp_modules,
               speculative_config, draft_model]
    impact: "num_nextn_predict_layers ships a module containing a full MoE FFN plus
      embed/head, which vLLM loads when --num-speculative-tokens > 0. It is absent from
      the weight estimate: roughly one MoE layer's worth of routed bytes, ~1 GiB/GPU at
      EP=32 for GLM-5.2. Also unmodeled: speculative KV / token-budget occupancy under
      saturation (#1627) and the draft model's own cost."
    direction: optimistic
    scope: "Speculative-decode THROUGHPUT is modeled (#1528: verify width vs accepted
      tokens, sim/latency/trained_physics_model.go:531,:571-578). It is the MTP module's
      WEIGHTS and its KV occupancy that are missing."
    seam_refs: ["sim/latency/kv_capacity.go:602-723",
                "sim/latency/trained_physics_model.go:531"]
    documented_in: "docs/reference/models.md:43-44"

  - id: explicit_head_dim_step_time_blind
    mechanism: "Explicit head_dim differing from hidden_size / num_attention_heads"
    keywords: [head_dim]
    impact: "The step-time models compute headDim = hidden_size/num_attention_heads and
      dKV = num_kv_heads x that quotient, ignoring an explicit head_dim
      (sim/latency/trained_physics_model.go:1078,:1150; sim/latency/roofline.go:74).
      GLM-5.2: 6144/64 = 96 vs the declared 192 — a 2x error in the attention FLOP and
      KV-bandwidth terms, understating step time."
    direction: optimistic
    scope: "KV capacity and weight sizing DO use it (EffectiveHeadDim,
      sim/model_hardware_config.go:46-54); the scoping to the capacity path is
      deliberate, to keep step-time golden datasets byte-identical."
    seam_refs: ["sim/latency/trained_physics_model.go:1078",
                "sim/latency/trained_physics_model.go:1150",
                "sim/latency/roofline.go:74",
                "sim/model_hardware_config.go:43-45"]
    documented_in: "docs/reference/models.md:30"

  - id: vision_tower_unmodeled
    mechanism: "Multimodal encoders (vision / audio towers) and their projectors"
    keywords: [vision_config, vision_tower, audio_config, image_token_index,
               image_token_id, mm_projector, multi_modal_projector, vision_feature_layer,
               boi_token_index, patch_size, num_image_tokens]
    impact: "ParseHFConfig pivots text_config onto the top level and drops every other
      sub-config, so BLIS models the TEXT tower alone. The encoder's weights are not
      charged, and image/audio prefill tokens are not costed as encoder work.
      Under-estimates both weight footprint and TTFT for multimodal serving."
    direction: optimistic
    scope: "Judging a multimodal model on its text tower is correct for the text
      decode path, which is what BLIS simulates."
    seam_refs: ["sim/latency/config.go:222-227"]
    documented_in: "code-only"

  - id: expert_parallel_sizing_average
    mechanism: "Expert-parallel weight sharding and its residual per-GPU terms"
    keywords: [num_redundant_experts, enable_eplb, ep_size, expert_parallel]
    impact: "The routed-expert charge is the continuous average num_experts/ep_size per
      GPU, while vLLM sizes KV from the MOST-LOADED rank, whose expert map is a
      contiguous block partition (256 experts at ep_size=48 gives 5 on 47 ranks and 21
      on the last). --num-redundant-experts is unmodeled. Two residual terms become
      dominant once the routed term shrinks by DP: the flat 8.0 GiB MoE activation
      budget compared against a TP-GPU budget, and the 0.6 GiB/GPU non-torch allowance,
      which was calibrated for non-EP NCCL and does not cover DeepEP / pplx all-to-all
      workspaces. The router/gate is charged on the TP path though vLLM replicates it
      under EP (~0.1 GiB). All point the same way."
    direction: optimistic
    scope: "Deployment-shaped, not config-shaped: nothing in a config.json triggers
      this, so match_gaps() will rarely fire it. Treat post-EP KV headroom as an upper
      bound. A group wider than num_experts is clamped with a warning rather than
      charged the sub-one-expert average."
    seam_refs: ["sim/latency/kv_capacity.go:716-720",
                "sim/latency/kv_capacity.go:484-498",
                "sim/latency/kv_capacity.go:354-359"]
    documented_in: "docs/reference/models.md:42"
