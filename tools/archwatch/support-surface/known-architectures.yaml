# archwatch — cold-start seed set of already-known model architectures.
#
# Purpose: the novelty filter's first suppressor. An architecture string in this
# set is NOT new, so it never becomes a candidate. Being here says nothing about
# whether BLIS models it WELL — that is known-gaps.yaml's job.
